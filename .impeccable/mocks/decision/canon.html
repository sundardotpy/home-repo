<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#FEF7FF;font-family:Roboto,sans-serif;color:#1D1B20}
.bar{height:44px;display:flex;align-items:center;padding:0 20px;font-size:13px}
.search{margin:8px 16px 0;height:56px;border-radius:28px;background:#ECE6F0;display:flex;align-items:center;padding:0 16px;gap:12px}
.search span{flex:1;color:#49454F;font-size:16px}
.h{font-size:14px;font-weight:500;color:#49454F;margin:20px 16px 4px}
.li{display:flex;gap:16px;padding:12px 16px;align-items:center}
.av{width:40px;height:40px;border-radius:20px;background:#E8DEF8;display:grid;place-items:center;color:#4A4458;font-weight:500}
.t{font-size:16px}.s{font-size:14px;color:#49454F}
.fab{position:absolute;right:16px;bottom:104px;width:56px;height:56px;border-radius:16px;background:#EADDFF;display:grid;place-items:center;font-size:24px;box-shadow:0 3px 6px rgba(0,0,0,.2)}
.nav{position:absolute;left:0;right:0;bottom:0;height:80px;background:#F3EDF7;display:flex;justify-content:space-around;padding-top:12px}
.ni{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:500;color:#49454F}
.pill{width:64px;height:32px;border-radius:16px;display:grid;place-items:center}.on .pill{background:#E8DEF8}
</style></head><body>
<div class="bar">9:41</div>
<div class="search"><span>☰</span><span>Search your things</span><span>◉</span></div>
<p class="h">Recent</p>

<p class="h">All items</p>
<div class="li"><div class="av">P</div><div><p class="t">Passport</p><p class="s">Bedroom › Wardrobe › Documents folder</p></div></div>
<div class="li"><div class="av">X</div><div><p class="t">Xbox controller</p><p class="s">Office › Container 01</p></div></div>
<div class="li"><div class="av">T</div><div><p class="t">Tea strainer</p><p class="s">Kitchen › Top drawer</p></div></div>
<div class="li"><div class="av">H</div><div><p class="t">Hard disk 1TB</p><p class="s">Office › Container 02</p></div></div>
<div class="fab">＋</div>
<div class="nav"><div class="ni on"><span class="pill">⌕</span>Find</div><div class="ni"><span class="pill">▤</span>Places</div><div class="ni"><span class="pill">↺</span>History</div></div>
</body></html>
