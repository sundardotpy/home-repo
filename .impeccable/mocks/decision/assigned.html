<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#EEF2F2;font-family:'Roboto Flex',sans-serif;color:#1C2326}
.bar{height:44px;display:flex;align-items:center;padding:0 20px;font-size:13px;font-weight:500}
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 0 20px}
.word{font-size:22px;font-weight:700;letter-spacing:-.4px}
.gear{width:48px;height:48px;border-radius:24px;display:grid;place-items:center;font-size:20px}
.search{margin:12px 16px 0;height:56px;border-radius:28px;background:rgba(255,255,255,.72);border:1px solid rgba(28,35,38,.08);display:flex;align-items:center;padding:0 6px 0 20px;gap:8px}
.search span{flex:1;color:#5B6669;font-size:16px}
.ic{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;background:rgba(14,94,88,.10);color:#0E5E58;font-weight:700}
.h{font-size:12px;font-weight:700;letter-spacing:1px;color:#5B6669;margin:22px 20px 8px}
.row{display:flex;gap:14px;padding:12px 20px 12px 20px;align-items:flex-start}
.av{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;font-weight:700;color:#1C2326}
.name{font-size:18px;font-weight:500;line-height:24px}
.stack{display:flex;flex-direction:column;gap:3px;margin-top:6px;padding-left:10px;border-left:2px solid rgba(28,35,38,.18)}
.tab{height:22px;display:inline-flex;align-items:center;padding:0 10px;border-radius:6px;font-size:12px;font-weight:500;width:max-content;border:1px solid rgba(28,35,38,.10);backdrop-filter:blur(4px)}
.t1{margin-left:0}.t2{margin-left:10px}.t3{margin-left:20px}
.office{background:rgba(184,224,210,.75)}.bed{background:rgba(242,196,206,.75)}.kit{background:rgba(243,217,164,.8)}
.inner{background:rgba(255,255,255,.85)}
.held{font-size:11px;color:#0E5E58;font-weight:700;margin-top:4px}
.fab{position:absolute;right:16px;bottom:104px;height:56px;padding:0 20px;border-radius:16px;background:#0E5E58;color:#fff;display:flex;align-items:center;gap:8px;font-weight:500;font-size:15px;box-shadow:0 3px 8px rgba(0,0,0,.18)}
.nav{position:absolute;left:0;right:0;bottom:0;height:88px;background:#E3E9E9;display:flex;justify-content:space-around;padding-top:12px}
.ni{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:500;color:#3E494C}
.pill{width:64px;height:32px;border-radius:16px;display:grid;place-items:center}
.on .pill{background:#B8E0D2}.on{color:#1C2326}
</style></head><body>
<div class="bar">9:41</div>
<div class="top"><span class="word">h/repo</span><span class="gear">⚙</span></div>
<div class="search"><span>Where did I put it?</span><span class="ic">◉</span><span class="ic">⌗</span></div>
<p class="h">PUT AWAY TODAY</p>
<div class="row"><div class="av office">E</div><div><p class="name">Spare earbuds</p>
  <div class="stack"><span class="tab office t1">Office</span><span class="tab inner t2">Grey Pouch 01</span></div>
  <p class="held">Moved 2 min ago</p></div></div>
<p class="h">YOUR THINGS</p>
<div class="row"><div class="av bed">P</div><div><p class="name">Passport</p>
  <div class="stack"><span class="tab bed t1">Bedroom</span><span class="tab inner t2">Wardrobe</span><span class="tab inner t3">Documents folder</span></div></div></div>
<div class="row"><div class="av office">X</div><div><p class="name">Xbox controller</p>
  <div class="stack"><span class="tab office t1">Office</span><span class="tab inner t2">Container 01</span></div></div></div>
<div class="row"><div class="av kit">T</div><div><p class="name">Tea strainer</p>
  <div class="stack"><span class="tab kit t1">Kitchen</span><span class="tab inner t2">Top drawer</span></div></div></div>
<div class="fab">＋ Add</div>
<div class="nav"><div class="ni on"><span class="pill">⌕</span>Find</div><div class="ni"><span class="pill">▤</span>Places</div><div class="ni"><span class="pill">↺</span>History</div></div>
</body></html>
