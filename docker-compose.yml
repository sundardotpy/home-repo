services:
  # Local Postgres, for working offline. Opt in with:
  #   docker compose --profile localdb up
  # Otherwise DATABASE_URL points at Neon (see .env.example) and this never
  # starts, which keeps a second, silently diverging copy of the data from
  # existing.
  db:
    image: postgres:16-alpine
    profiles: ["localdb"]
    environment:
      POSTGRES_USER: hsh
      POSTGRES_PASSWORD: hsh
      POSTGRES_DB: home_repo
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hsh -d home_repo"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      target: dev
    # Rebuild after Dockerfile changes (for example, switching from Go to Node)
    # even when an older locally tagged image already exists.
    pull_policy: build
    env_file:
      - path: .env
        required: false
    environment:
      # Compose loads .env for interpolation; use the bundled database only
      # when DATABASE_URL is unset (start it with --profile localdb).
      DATABASE_URL: ${DATABASE_URL:-postgres://hsh:hsh@db:5432/home_repo?sslmode=disable}
      PORT: "8080"
      APP_ENV: dev
      # db keeps photos in Postgres (works on read-only/serverless hosts);
      # disk writes them to the volume below.
      MEDIA_BACKEND: ${MEDIA_BACKEND:-db}
      UPLOAD_DIR: /data/uploads
      # Absolute URL encoded into printed QR labels. Unset in dev, so labels
      # point at whichever host the browser used. Set this before printing
      # anything you intend to keep.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Optional: one shared passcode that locks the app. Unset at home.
      APP_PASSCODE: ${APP_PASSCODE:-}
      # Optional: bearer token that enables the MCP endpoint at /mcp for
      # external AI clients. Unset = the endpoint does not exist.
      MCP_TOKEN: ${MCP_TOKEN:-}
    ports:
      - "8080:8080"
    init: true
    # Install only when package-lock.json changed since the last install. The
    # hash lives in the node_modules volume, so restarting with an unchanged
    # lockfile skips npm ci and starts in seconds. ($$ escapes Compose
    # interpolation; the shell sees single $.)
    command: >
      sh -c 'want=$$(md5sum package-lock.json | cut -d" " -f1);
      [ -f node_modules/.ci-hash ] && [ "$$(cat node_modules/.ci-hash)" = "$$want" ]
      || { npm ci --no-audit --no-fund && echo "$$want" > node_modules/.ci-hash; };
      npm run dev'
    # The db service only runs under the localdb profile; required: false keeps
    # this valid when DATABASE_URL points elsewhere and db never starts.
    depends_on:
      db:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 1m
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - uploads:/data/uploads

  # Tailwind, on demand only: `docker compose --profile css up css` rebuilds
  # app.css on every save. The built file is committed, so the app runs without
  # this service ever starting.
  css:
    image: node:22-alpine
    profiles: ["css"]
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run css:watch"
    volumes:
      - .:/app
      - css_node_modules:/app/node_modules
      - npmcache:/root/.npm

volumes:
  pgdata:
  node_modules:
  css_node_modules:
  npmcache:
  uploads:
