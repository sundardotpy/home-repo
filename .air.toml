root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/server ./cmd/server"
  bin = "./tmp/server"
  # Assets are embedded in the binary, so a JS or CSS edit needs a rebuild too.
  include_ext = ["go", "sql", "html", "js", "css"]
  exclude_dir = ["tmp", "vendor", ".git", "uploads", "node_modules"]
  delay = 300
  stop_on_error = true

[log]
  time = true
