<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <meta name="theme-color" content="#f6f2e7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171610" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="h/repo" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Know what you own and where it is." />
    <title>Home Repo</title>
    <link rel="stylesheet" href="/static/css/app.css" />
    <link rel="icon" href="/static/brand/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/static/manifest.json" />
    <link rel="apple-touch-icon" href="/static/brand/apple-touch-icon.png" />
    <link rel="mask-icon" href="/static/brand/mask-icon.svg" color="#1e2533" />
    <!-- The body font is on the first paint's critical path. -->
    <link rel="preload" href="/static/fonts/dm-sans.woff2" as="font" type="font/woff2" crossorigin />
    <!-- app.js imports these; without preloading, the browser finds them one
         request deep at a time. -->
    <link rel="modulepreload" href="/static/js/store.js" />
    <link rel="modulepreload" href="/static/js/ui.js" />
    <link rel="modulepreload" href="/static/js/api.js" />
    <link rel="modulepreload" href="/static/js/cache.js" />
    <link rel="modulepreload" href="/static/js/components.js" />
    <link rel="modulepreload" href="/static/js/item-icons.js" />
    <link rel="modulepreload" href="/static/js/icon-set.js" />
    <link rel="modulepreload" href="/static/js/brand-icons.js" />
    <link rel="modulepreload" href="/static/js/look.js" />
    <link rel="modulepreload" href="/static/js/labels.js" />
    <link rel="modulepreload" href="/static/js/photos.js" />
    <link rel="modulepreload" href="/static/js/theme.js" />
    <script>
      // Before first paint, so a chosen look never flashes the default.
      try {
        var d = document.documentElement;
        var ui = localStorage.getItem('hsh.ui');
        if (ui === 'repo') d.classList.add('ui-repo');
        var a = localStorage.getItem('hsh.accent');
        if (a && ui !== 'repo') {
          d.style.setProperty('--color-accent', a);
        }
        var m = localStorage.getItem('hsh.theme') || 'system';
        var dark = m === 'dark' || (m === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) d.classList.add('dark');
        // The system bar takes the app's own background, so the two read as one.
        var bg = getComputedStyle(d).getPropertyValue('--canvas').trim();
        if (bg) document.querySelectorAll('meta[name=theme-color]').forEach(function (m) { m.setAttribute('content', bg); });
      } catch (e) {}
    </script>
  </head>
  <body class="min-h-dvh">
    <!-- Desktop: the same destinations as the phone's bottom bar, up top. -->
    <header id="topbar" class="no-print">
      <div class="mx-auto max-w-5xl flex items-center gap-4 flex-wrap">
        <a href="#/" class="flex items-center shrink-0" aria-label="h/repo, home">
          <img class="logo-light h-8 w-auto" src="/static/brand/wordmark.svg" alt="h/repo" />
          <img class="logo-dark h-8 w-auto" src="/static/brand/wordmark-dark.svg" alt="" />
        </a>
        <div class="flex-1"></div>
        <nav class="topnav" aria-label="Main" id="topnav"></nav>
        <div class="flex-1"></div>
        <button type="button" id="topbar-add" class="btn btn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" class="w-5 h-5" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span>Put it away</span>
        </button>
        <a href="#/settings" id="topbar-settings" class="topround" aria-label="Settings" data-nav-match="#/settings"></a>
      </div>
    </header>

    <div id="app-shell">
      <div class="mx-auto w-full max-w-3xl lg:max-w-4xl">
        <header
          id="header"
          class="sticky top-0 lg:static z-20 bg-[var(--canvas)]/90 backdrop-blur-md"
          style="padding-top: env(safe-area-inset-top)"
        >
          <!-- First paint, before any JS: the shape of the screen, already there. -->
          <div class="px-4 pt-4 pb-2">
            <div class="skeleton h-9 w-52"></div>
            <div class="skeleton h-14 w-full mt-4 rounded-[1.75rem]"></div>
          </div>
        </header>

        <main id="screen" class="pb-32 lg:pb-12">
          <div class="px-4">
            <div class="skeleton h-3 w-24 mt-6 mb-3"></div>
            <div class="surface overflow-hidden">
              <div class="flex items-center gap-3 px-4 py-3.5">
                <div class="skeleton w-11 h-11 rounded-full"></div>
                <div class="flex-1 space-y-2">
                  <div class="skeleton h-3.5 w-1/2"></div>
                  <div class="skeleton h-2.5 w-1/4"></div>
                </div>
              </div>
              <div class="flex items-center gap-3 px-4 py-3.5 border-t border-[var(--line)]">
                <div class="skeleton w-11 h-11 rounded-full"></div>
                <div class="flex-1 space-y-2">
                  <div class="skeleton h-3.5 w-2/3"></div>
                  <div class="skeleton h-2.5 w-1/3"></div>
                </div>
              </div>
              <div class="flex items-center gap-3 px-4 py-3.5 border-t border-[var(--line)]">
                <div class="skeleton w-11 h-11 rounded-full"></div>
                <div class="flex-1 space-y-2">
                  <div class="skeleton h-3.5 w-2/5"></div>
                  <div class="skeleton h-2.5 w-1/5"></div>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- Toasts sit above the nav bar, out of the thumb's way. -->
    <div
      id="toast-root"
      class="no-print fixed inset-x-0 bottom-28 lg:bottom-6 z-40 mx-auto w-full max-w-md px-4 pointer-events-none"
    ></div>

    <!-- The add button floats beside the bar, always one tap away. -->
    <button id="fab" type="button" aria-label="Add something" class="no-print lg:hidden">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" class="w-7 h-7" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <!-- Lights up while writes are still on their way to the server. -->
      <span id="sync-pip" class="hidden absolute -top-0.5 -right-0.5 w-3.5 h-3.5 rounded-full bg-[var(--ink)] border-2 border-[var(--canvas)] animate-pulse"></span>
    </button>

    <nav id="app-nav" class="no-print lg:hidden" aria-label="Main"></nav>

    <div id="sheet-root"></div>

    <script type="module" src="/static/js/app.js"></script>
  </body>
</html>
